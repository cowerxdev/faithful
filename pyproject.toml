[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "faithful"
version = "0.1.0"
description = "Literal grounding check for generated summaries"
requires-python = ">=3.9"
license = {text = "MIT"}
[project.scripts]
faithful = "faithful.__main__:main"
[tool.setuptools]
packages = ["faithful"]
